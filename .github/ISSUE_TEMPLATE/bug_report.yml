name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a workspace in two tabs
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit you are running.
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: Chrome 142 on macOS 16
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Browser console or `wrangler tail` output, if relevant.
      render: text
