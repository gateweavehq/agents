name: CLA

on:
  issue_comment:
    types: [created]
  # pull_request_target gives the bot write access on pull requests from forks. It never checks
  # out pull request code, which is what keeps this trigger safe.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-latest
    steps:
      # Gateweave Agents' bots commit what agents write in this organization's workspaces. Their
      # commits pass only on this repository's own branches: anyone can install the production
      # app, so on a fork the agent behind them could be anyone's.
      - id: allowlist
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          list="xgame92,dependabot[bot],renovate[bot]"
          # A comment on an issue that is not a pull request is treated like a fork's.
          cross=$(gh pr view "$NUMBER" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository || echo true)
          if [ "$cross" = "false" ]; then
            list="$list,gateweave-agents[bot],gateweave-agents-staging[bot]"
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
      # Pinned to a commit because this job runs with write permissions. Tag: v2.6.1
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/gateweavehq/agents/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          # Signatures live on their own branch so main can stay protected.
          branch: cla-signatures
          allowlist: ${{ steps.allowlist.outputs.list }}
