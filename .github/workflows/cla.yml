name: CLA

on:
  issue_comment:
    types: [created]
  # pull_request_target gives the bot write access on pull requests from forks. It never checks
  # out pull request code, which is what keeps this trigger safe.
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit because this job runs with write permissions. Tag: v2.6.1
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/gateweavehq/agents/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          # Signatures live on their own branch so main can stay protected.
          branch: cla-signatures
          allowlist: xgame92,dependabot[bot],renovate[bot]
