name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  # Skips the browser tests when a pull request changes nothing the app is built from, such as a
  # release's changelog. Pushes to main always run them.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request checks out the merge GitHub made; its first parent is the base.
          app=false
          while read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              apps/web/*|packages/*|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|wrangler.jsonc|.node-version|.github/workflows/*) app=true ;;
            esac
          done <<< "$(git diff --name-only HEAD^1 HEAD)"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "App changed: $app."

  # What only a browser shows: a page a policy breaks, and what someone sees of a socket that closes.
  e2e:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        # With the system libraries it needs. When the runner can't reach Ubuntu's package mirror,
        # as happens, Chromium alone: the runner's image has Chrome, and so the same libraries.
        run: |
          timeout 180 pnpm --filter @gateweave/agents-web exec playwright install --with-deps chromium ||
            pnpm --filter @gateweave/agents-web exec playwright install chromium
      - name: Build and run the browser tests
        run: pnpm test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
