name: Announce

# Gateweave's own: a published release is handed to the tool that posts its announcement, with one
# workflow for each network (the LinkedIn page and X), so each can be changed or paused alone. The
# post goes out without a person approving it; each workflow's prompt keeps it to the CHANGELOG
# entry. It is apart from the deploys, so a failure here holds nothing back, and a fork without the
# secrets skips it.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    if: github.repository == 'gateweavehq/agents'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Send the release's CHANGELOG entry
        env:
          LINKEDIN_HOOK: ${{ secrets.OCOYA_RELEASE_HOOK }}
          X_HOOK: ${{ secrets.OCOYA_RELEASE_HOOK_X }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
        run: |
          if [ -z "$LINKEDIN_HOOK$X_HOOK" ]; then
            echo "No address to send to; skipping."
            exit 0
          fi
          version="${TAG#v}"
          # A patch release (x.y.1 and up) is a fix, and a row of posts about fixes is noise for the
          # people who follow: only a release that ends in .0 is announced.
          case "$version" in
            *.0) ;;
            *) echo "$version is a patch release; not announced."; exit 0 ;;
          esac
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | head -c 2000 > entry.md
          if [ -z "$(tr -d '[:space:]' < entry.md)" ]; then
            echo "CHANGELOG.md has no entry for $version; nothing to announce."
            exit 0
          fi
          jq -n --arg product "Gateweave Agents" --arg version "$TAG" --arg url "$URL" \
            --arg image "https://gateweave.com/og/agents.png" --rawfile entry entry.md \
            '{product: $product, version: $version, url: $url, image: $image,
              summary: ($product + " " + $version + "\n\n" + $entry)}' > body.json
          # Each address is a password, so curl must not echo it: no -v, and errors without the URL.
          # One network failing or hanging does not stop the other (each request has a time limit); the job
          # fails afterwards so it shows.
          failed=0
          for network in linkedin x; do
            case "$network" in
              linkedin) hook="$LINKEDIN_HOOK" ;;
              x) hook="$X_HOOK" ;;
            esac
            if [ -z "$hook" ]; then
              echo "No address for $network; skipped."
              continue
            fi
            # A request that times out after the headers still reports their status, so curl's own exit
            # code decides too.
            code=0
            status="$(curl -sS --proto '=https' --connect-timeout 10 --max-time 60 -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' \
              --data @body.json "$hook" 2>/dev/null)" || code=$?
            echo "The $network workflow answered ${status:-nothing} (curl exit $code)."
            if [ "$code" -ne 0 ]; then
              failed=1
              continue
            fi
            case "$status" in 2*) ;; *) failed=1 ;; esac
          done
          exit "$failed"
