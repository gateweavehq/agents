name: Claim sweep

# Once a day: a claim with no pull request from its holder after 7 days is released, and the issue
# is free again. Also re-checks pull requests labelled `unclaimed`, in case their author has
# claimed the issue since. Run it by hand to sweep now.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: claim-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Tag: v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: scripts/claim.mjs
      - run: node scripts/claim.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
