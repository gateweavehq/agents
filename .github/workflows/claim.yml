name: Claims

# `/claim` and `/release` on issues labelled `together`, and a label and comment on a pull request
# that mentions no issue its author holds (it is never closed). The rules live in
# scripts/claim.mjs and are tested in scripts/claim.test.mjs.
#
# pull_request_target gives the job a token that can write on pull requests from forks. It never
# checks out pull request code: the checkout below is the default branch, and the script reads the
# pull request only through the API. That is what keeps this trigger safe.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

# One comment run per account at a time, and the open claims are counted from the issues endpoint,
# which sees a claim made a moment ago, not from the search index. An account can only claim for
# itself unless it is a maintainer, who is exempt from the limit, so one group per commenter covers
# the limit. A single group for every comment would not do: a group holds one waiting run and
# cancels the rest, so a burst would silently drop commands. If one account posts several commands
# within seconds, the ones in between can still be dropped; it can repeat them.
concurrency:
  group: claim-${{ github.event_name == 'issue_comment' && github.event.comment.user.login || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  claim:
    if: >-
      github.event_name == 'pull_request_target' ||
      (!github.event.issue.pull_request &&
        (contains(github.event.comment.body, '/claim') ||
         contains(github.event.comment.body, '/release')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Tag: v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/claim.mjs
      - run: node scripts/claim.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
