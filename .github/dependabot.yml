version: 2
updates:
  # Workflow actions are pinned; keep them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # One weekly pull request for npm updates, so pinned versions do not drift far.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Under vitest 5.1.0 a timer set inside a Durable Object in the Workers pool never fires, so a
      # moved conversation never restarts and test/move.test.ts in packages/runtime fails. Nothing
      # changes outside tests. Try the next release.
      - dependency-name: vitest
        versions: ["5.1.0"]
    open-pull-requests-limit: 5
