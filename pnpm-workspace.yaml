packages:
  - apps/*
  - packages/*

# Versions shared across workspace packages. Reference them with "catalog:".
#
# Every package with agents also depends on its peers, so that agents resolves once: two copies would
# not share their types, nor their code in the bundle. They are @ai-sdk/react,
# @modelcontextprotocol/server, vite, and vite's own peers @types/node and esbuild. `pnpm check` holds
# this.
catalog:
  "@ai-sdk/openai-compatible": 3.0.82
  "@ai-sdk/provider": 4.0.35
  "@ai-sdk/react": 4.0.163
  "@cloudflare/ai-chat": 0.12.2
  "@cloudflare/vitest-plugin": 1.4.12
  "@modelcontextprotocol/server": 2.4.0
  "@types/node": 26.6.6
  agents: 0.32.0
  ai: 7.0.159
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  esbuild: 0.28.2
  typescript: 7.0.2
  vite: 8.3.5
  vitest: 5.0.5
  wrangler: 4.156.1
  zod: 4.6.7

allowBuilds:
  # Its install script only prints a banner. It comes with agents, through mimetext.
  core-js-pure: false
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.16"
  - "@better-auth/drizzle-adapter@1.7.16"
  - "@better-auth/kysely-adapter@1.7.16"
  - "@better-auth/memory-adapter@1.7.16"
  - "@better-auth/mongo-adapter@1.7.16"
  - "@better-auth/prisma-adapter@1.7.16"
  - "@better-auth/telemetry@1.7.16"
  - better-auth@1.7.16
  - lucide-react@1.62.0
  - better-call@1.4.5

# undici below 7.30.1 has high advisories (GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26,
# GHSA-2m5v-pch6-74hx and others). It only comes in through miniflare, for local dev and tests.
overrides:
  undici@>=7.0.0 <7.30.1: 7.30.1
  # esbuild up to 0.24.2 lets any website read a running esbuild dev server
  # (GHSA-67mh-4wv8-2f99). drizzle-kit brings 0.18.20 through @esbuild-kit/core-utils, which only
  # calls transform and transformSync and never starts that server.
  esbuild@<0.25.0: 0.25.12
