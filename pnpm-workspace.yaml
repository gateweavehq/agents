packages:
  - apps/*
  - packages/*

# Versions shared across workspace packages. Reference them with "catalog:".
catalog:
  "@ai-sdk/openai-compatible": 3.0.80
  "@ai-sdk/provider": 4.0.34
  "@cloudflare/ai-chat": 0.12.2
  "@cloudflare/vitest-plugin": 1.4.8
  # An optional peer of agents. Every package with agents depends on it too, so that agents
  # resolves once: two copies would not share their types, nor their code in the bundle.
  "@modelcontextprotocol/server": 2.3.1
  agents: 0.31.0
  ai: 7.0.154
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  typescript: 7.0.2
  vitest: 5.0.5
  wrangler: 4.153.0
  zod: 4.6.7

allowBuilds:
  # Its install script only prints a banner. It comes with agents, through mimetext.
  core-js-pure: false
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@better-auth/core@1.7.14"
  - "@better-auth/drizzle-adapter@1.7.14"
  - "@better-auth/kysely-adapter@1.7.14"
  - "@better-auth/memory-adapter@1.7.14"
  - "@better-auth/mongo-adapter@1.7.14"
  - "@better-auth/prisma-adapter@1.7.14"
  - "@better-auth/telemetry@1.7.14"
  - better-auth@1.7.14
  - lucide-react@1.62.0
